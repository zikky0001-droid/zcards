<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shoob Card Scraper</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --card: #151b2e;
      --card-2: #1a2138;
      --border: #252d45;
      --text: #e8ecf5;
      --muted: #8892a8;
      --green: #22c55e;
      --green-2: #16a34a;
      --blue: #3b82f6;
      --blue-2: #2563eb;
      --red: #ef4444;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #1e2a4a 0%, transparent 70%),
        var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .container { width: 100%; max-width: 560px; margin: 0 auto; }

    .logo {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .logo::before {
      content: "◆";
      font-size: 0.9rem;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #ffffff 0%, #8a94b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .card {
      background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 12px 40px rgba(0,0,0,0.35);
      margin-bottom: 1.25rem;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
    }
    button {
      padding: 0.95rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      color: white;
      transition: transform 0.12s ease, box-shadow 0.18s ease, opacity 0.15s ease;
      letter-spacing: -0.01em;
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    button:not(:disabled):hover { transform: translateY(-1px); }
    button:not(:disabled):active { transform: translateY(0); }

    #startBtn {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-2) 100%);
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.28);
    }
    #startBtn:not(:disabled):hover {
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    }
    #downloadBtn {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%);
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.28);
    }
    #downloadBtn:not(:disabled):hover {
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    .status-card {
      margin-top: 1.15rem;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }
    .status-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s ease, box-shadow 0.3s ease;
      flex-shrink: 0;
    }
    .dot.running {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot.done  { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
    .dot.error { background: var(--red);  box-shadow: 0 0 8px var(--red); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.45; transform: scale(0.85); }
    }

    .status-text {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.5;
    }
    .count {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-weight: 700;
      color: var(--blue);
      font-size: 1rem;
    }
    .err { color: var(--red); }

    .partial-badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.18rem 0.5rem;
      background: rgba(251, 191, 36, 0.14);
      color: var(--amber);
      border-radius: 5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .progress-wrap {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.85rem;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green) 0%, var(--blue) 100%);
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .footnote {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
      margin-top: 1.5rem;
    }
    .footnote b { color: var(--text); font-weight: 600; }

    @media (max-width: 420px) {
      .actions { grid-template-columns: 1fr; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Shoob Tools</div>
    <h1>Card Scraper</h1>
    <p class="subtitle">Pull the full Shoob card catalog into a single JSON file. Download works any time.</p>

    <div class="card">
      <div class="actions">
        <button id="startBtn">▶ Start Scraping</button>
        <button id="downloadBtn" disabled>⬇ Download</button>
      </div>

      <div class="status-card">
        <div class="status-header">
          <span class="dot" id="dot"></span>
          <span id="statusLabel">Idle</span>
        </div>
        <div class="status-text" id="status">Waiting to start…</div>
        <div class="progress-wrap" id="progressWrap" style="display:none">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>

    <p class="footnote">
      You can download <b>while the scrape is running</b> — you'll get a partial file.
    </p>
  </div>

  <script>
    const startBtn    = document.getElementById("startBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl    = document.getElementById("status");
    const statusLabel = document.getElementById("statusLabel");
    const dot         = document.getElementById("dot");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar  = document.getElementById("progressBar");

    let pollTimer = null;
    let lastCount = 0;

    function setDot(state) {
      dot.className = "dot" + (state ? " " + state : "");
    }
    function showProgress(pct) {
      if (pct == null) { progressWrap.style.display = "none"; return; }
      progressWrap.style.display = "block";
      progressBar.style.width = Math.max(0, Math.min(100, pct)) + "%";
    }

    async function refresh() {
      try {
        const res = await fetch("/api/status");
        const s = await res.json();
        lastCount = s.cardCount || 0;

        if (s.isScraping) {
          setDot("running");
          statusLabel.textContent = "Scraping";
          const pct = s.progress != null ? s.progress * 100 : null;
          statusEl.innerHTML =
            `Collected <span class="count">${lastCount.toLocaleString()}</span>` +
            (s.expectedTotal ? ` of <span class="count">${s.expectedTotal.toLocaleString()}</span>` : "") +
            ` cards` +
            `<span class="partial-badge">partial download ready</span>`;
          showProgress(pct);
          startBtn.disabled = true;
          downloadBtn.disabled = lastCount === 0;
        } else if (s.error) {
          setDot("error");
          statusLabel.textContent = "Error";
          statusEl.innerHTML = `<span class="err">${s.error}</span>`;
          showProgress(null);
          startBtn.disabled = false;
          downloadBtn.disabled = lastCount === 0;
          if (pollTimer) clearInterval(pollTimer);
        } else if (lastCount > 0) {
          setDot("done");
          statusLabel.textContent = "Complete";
          statusEl.innerHTML = `Ready: <span class="count">${lastCount.toLocaleString()}</span> cards`;
          showProgress(100);
          startBtn.disabled = false;
          downloadBtn.disabled = false;
          if (pollTimer) clearInterval(pollTimer);
        } else {
          setDot("");
          statusLabel.textContent = "Idle";
          statusEl.textContent = "Waiting to start…";
          showProgress(null);
          startBtn.disabled = false;
          downloadBtn.disabled = true;
        }
      } catch (e) {
        setDot("error");
        statusLabel.textContent = "Network error";
        statusEl.innerHTML = `<span class="err">${e.message}</span>`;
      }
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      statusEl.textContent = "Starting…";
      const res = await fetch("/api/start", { method: "POST" });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        statusEl.innerHTML = `<span class="err">${d.error || "Failed to start"}</span>`;
        startBtn.disabled = false;
        return;
      }
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(refresh, 2000);
      refresh();
    };

    downloadBtn.onclick = () => { window.location.href = "/api/download"; };

    refresh();
  </script>
</body>
</html>
